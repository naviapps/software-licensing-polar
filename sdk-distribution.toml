[macos]
commands = [
  ["xcrun", "swift", "--version"],
  ["cargo", "fetch", "--locked"],
  ["make", "check-distribution"],
  [
    "git",
    "clone",
    "https://github.com/naviapps/software-licensing.git",
    "{temp}/software-licensing",
  ],
  [
    "python3",
    "-I",
    "-B",
    "{tooling}/tasks/sdk",
    "installed-consumers",
    "--git-dependency-source",
    "naviapps/software-licensing={temp}/software-licensing",
  ],
  ["python3", "-I", "-B", "{tooling}/tasks/sdk", "swift-consumer", "--distribution"],
]

[windows]
commands = [
  ["rustup", "install", "--no-self-update"],
  [
    "python",
    "-I",
    "-B",
    "{tooling}/tasks/sdk",
    "python",
    "-m",
    "unittest",
    "discover",
    "-s",
    "fixtures/distribution/tests",
  ],
  ["python", "-I", "-B", "{tooling}/tasks/sdk", "windows", "-m", "fixtures.distribution.windows"],
]
