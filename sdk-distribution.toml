[macos]
commands = [
  [
    "git",
    "clone",
    "https://github.com/naviapps/software-licensing.git",
    "{temp}/software-licensing",
  ],
  [
    "sdk-tooling",
    "rust-c-consumers",
    "--language",
    "rust",
    "--git-dependency-source",
    "naviapps/software-licensing={temp}/software-licensing",
  ],
]

[windows]
commands = [
  ["rustup", "install", "--no-self-update"],
  [
    "git",
    "clone",
    "https://github.com/naviapps/software-licensing.git",
    "{temp}/software-licensing",
  ],
  [
    "sdk-tooling",
    "rust-c-consumers",
    "--language",
    "rust",
    "--windows-architecture",
    "x64",
    "--git-dependency-source",
    "naviapps/software-licensing={temp}/software-licensing",
  ],
]
