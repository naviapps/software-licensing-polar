name: Polar SDK checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: polar-sdk-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    uses: naviapps/sdk-tooling/.github/workflows/check-sdk.yml@cf8488951a12565b80edb24dda5300021563d954
    with:
      source-macos: "26"
      windows: managed
