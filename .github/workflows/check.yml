name: Polar SDK checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: polar-sdk-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    uses: naviapps/sdk-tooling/.github/workflows/check-sdk.yml@40c6bf76530e61fc427db4b4ec8b7f8cf969f562
    with:
      source-macos: "26"
      windows: managed
