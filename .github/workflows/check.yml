name: Polar SDK checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: polar-sdk-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    uses: naviapps/sdk-tooling/.github/workflows/plan-checks.yml@54d09a55da0ffe938ebd13d708c53a2bd28d6be0
  swift:
    needs: plan
    if: ${{ needs.plan.outputs.documentation-only != 'true' }}
    name: Swift
    uses: naviapps/sdk-tooling/.github/workflows/check-swift.yml@54d09a55da0ffe938ebd13d708c53a2bd28d6be0
    with:
      source-macos: "26"
  windows:
    needs: plan
    if: ${{ needs.plan.outputs.documentation-only != 'true' }}
    name: Windows x64 Rust and .NET tests
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - uses: naviapps/sdk-tooling/.github/actions/test-rust-windows@main
        with:
          dotnet: "true"
      - name: Test .NET provider with the locked licensing core
        run: |
          $metadata = cargo metadata --format-version 1 --locked --filter-platform $env:CARGO_BUILD_TARGET | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $core = @($metadata.packages | Where-Object name -eq 'software-licensing')
          if ($core.Count -ne 1) { throw 'Expected one Cargo-locked SoftwareLicensing package.' }
          $root = Join-Path (Split-Path -Parent $core[0].manifest_path) '../..'
          $project = Join-Path $root 'bindings/dotnet/src/NaviApps.SoftwareLicensing/NaviApps.SoftwareLicensing.csproj'
          if (!(Test-Path -LiteralPath $project -PathType Leaf)) { throw 'The locked core source lacks a managed project.' }
          dotnet run --project bindings/dotnet/tests/SoftwareLicensing.Polar.Tests/SoftwareLicensing.Polar.Tests.csproj --configuration Release "-p:SoftwareLicensingProject=$project"
