[package]
name = "software-licensing-polar"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
repository = "https://github.com/naviapps/software-licensing-polar"
rust-version = "1.99"

[workspace]
members = ["crates/ffi"]
resolver = "3"

# The installed-consumer check reads this shared type dependency from the workspace.
[workspace.dependencies]
software-licensing = { git = "https://github.com/naviapps/software-licensing.git", rev = "011eae1033f3e919b1d23ab15fc3cd39939d7660" }

[dependencies]
httpdate = "1"
reqwest = { version = "0.13.5", default-features = false, features = [
  "native-tls",
  "system-proxy",
  "stream",
] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
software-licensing.workspace = true
time = { version = "0.3", features = ["parsing", "formatting"] }
tokio = { version = "1", features = ["macros", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "net", "rt", "sync", "test-util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "none"
