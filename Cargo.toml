[workspace]
members = ["crates/ffi", "crates/provider"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
repository = "https://github.com/naviapps/software-licensing-polar"
rust-version = "1.99"

[workspace.dependencies]
httpdate = "1"
reqwest = { version = "0.13.5", default-features = false, features = [
  "native-tls",
  "system-proxy",
  "stream",
] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
software-licensing = { git = "https://github.com/naviapps/software-licensing.git", rev = "ceda779224b9e52500f452923d5018150f2ac902" }
software-licensing-polar = { path = "crates/provider" }
time = { version = "0.3", features = ["parsing", "formatting"] }
tokio = { version = "1", features = [
  "rt-multi-thread",
  "net",
  "time",
  "sync",
  "macros",
  "io-util",
] }
zeroize = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "none"
